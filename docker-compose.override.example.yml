# Optional local ports when another project uses 5173 / 8000.
# Copy to docker-compose.override.yml; Compose then loads it automatically.
# Requires Docker Compose 2.24.4 or newer for !override.
services:
  backend:
    ports: !override
      - "127.0.0.1:8001:8000"
    environment:
      CORS_ORIGINS: http://localhost:5176
  frontend:
    ports: !override
      - "127.0.0.1:5176:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8001
